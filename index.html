<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断実績｜山口店舗集客</title>
  <meta name="description" content="山口県の店舗を対象にしたInstagram・Googleマップ・Web導線の診断実績。">
  <link rel="stylesheet" href="${shop.slug}.html"
</head>
<body>
<header class="site-header"><div class="container nav-wrap">
  <a class="brand" href="../index.html">山口店舗集客</a>
  <nav><a href="../service.html">サービス</a><a href="../index.html#flow">流れ</a><a href="../index.html#faq">FAQ</a><a href="index.html">診断実績</a><a href="../diagnosis.html">無料診断</a></nav>
</div></header>
<main>
<section class="hero compact"><div class="container"><p class="eyebrow">DIAGNOSIS CASES</p><h1>店舗診断の実績</h1><p class="lead">山口県内の店舗を、集客導線の視点から整理しています。</p></div></section>
<section class="section"><div class="container"><div id="shop-list" class="cards three"><article class="card"><p>読み込み中…</p></article></div></div></section>
</main>
<footer class="footer"><div class="container"><p>© 山口店舗集客</p></div></footer>
<script>
fetch("shops.json")
  .then(r => r.json())
  .then(shops => {
    const list = document.getElementById("shop-list");
    list.innerHTML = shops.map(shop => `
      <article class="card case-card">
        <span class="tag">${shop.area}</span>
        <h2>${shop.name}</h2>
        <p>${shop.summary}</p>
        <a class="text-link" href="${shop.slug}.html">診断を見る →</a>
      </article>
    `).join("");
  });
</script>
</body>
</html>
